services:
  minecraft:
    image: itzg/minecraft-server:latest
    pull_policy: daily
    restart: unless-stopped
    tty: true
    stdin_open: true
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      TYPE: "VANILLA" # Use PAPER for plugins or FABRIC for mods
      VERSION: "26.3" # Pin e.g. "1.21.11" to avoid automatic world upgrades
      DIFFICULTY: "normal"
      HARDCORE: "false"
      MODE: "survival"
      ENABLE_WHITELIST: "true"
      ENFORCE_WHITELIST: "true" # Kick online players who aren't whitelisted
      
      WHITELIST: ${MC_WHITELIST:-} # comma-separated usernames or WHITELIST: ${MC_WHITELIST:?MC_WHITELIST must be set in .env}
      OPS: ${MC_OPS:-}
      # PLUGINS: |          # Plugin URLs, one per line (needs TYPE: PAPER)
      # MODRINTH_PROJECTS: | # Modrinth slugs, one per line (PAPER or FABRIC)
    volumes:
      - /hdd/games/minecraft:/data

  playit:
    image: ghcr.io/playit-cloud/playit-agent:1.0
    network_mode: host
    restart: unless-stopped
    environment:
      # NOTE(shenukp1) Nov 19, 2026: `:?` allows you to write an error text when the variable is not set or empty
      SECRET_KEY: ${PLAYIT_SECRET_KEY:?PLAYIT_SECRET_KEY must be set in .env}
